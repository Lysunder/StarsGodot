name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    # The suite in four shards of about the same length, run side by side. "rest" takes every
    # suite the others don't name, so new suites land there.
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: golden-ai-a
            tests: -a res://tests/unit/turn/test_golden_ai_a.gd
            check: "0"
          - shard: golden
            tests: >-
              -a res://tests/unit/turn/test_golden_ai_b.gd
              -a res://tests/unit/turn/test_golden_turns.gd
            check: "0"
          - shard: classic-ai
            tests: >-
              -a res://tests/unit/ai/test_classic_turindrones.gd
              -a res://tests/unit/ai/test_classic_robotoids.gd
              -a res://tests/unit/ai/test_classic_automitrons.gd
            check: "0"
          - shard: rest
            tests: >-
              -a res://tests
              -i res://tests/unit/turn/test_golden_ai_a.gd
              -i res://tests/unit/turn/test_golden_ai_b.gd
              -i res://tests/unit/turn/test_golden_turns.gd
              -i res://tests/unit/ai/test_classic_turindrones.gd
              -i res://tests/unit/ai/test_classic_robotoids.gd
              -i res://tests/unit/ai/test_classic_automitrons.gd
            check: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Run tests
        run: |
          export GODOT_BIN="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          TESTS="${{ matrix.tests }}" CHECK_SCRIPTS="${{ matrix.check }}" bash tools/run_tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore

  lint:
    name: Lint and format (gdtoolkit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: gdlint
        run: gdlint core tests tools ui

      - name: gdformat --check
        run: gdformat --check core tests tools ui

      - name: Harness tests (Python)
        run: python -m unittest discover -s tools/harness -p "test_*.py" -v
